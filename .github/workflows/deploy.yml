name: Deploy static content to Pages

on:
  push:
    branches: ["main", "quizzcal-app-branch_with_original_folder_order"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: quizzcal-app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: quizzcal-app
      - name: Build
        run: npm run build
        working-directory: quizzcal-app
      - name: Setup Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './quizzcal-app/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4